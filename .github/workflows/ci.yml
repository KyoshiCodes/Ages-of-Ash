name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ages
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ages
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ages:ci_only_password@localhost:5432/ages
      APP_ORIGIN: http://localhost:5173
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:db
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: pnpm test:performance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results
