name: Release foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: verification_admin
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verification_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      VERIFY_ADMIN_URL: postgresql://verification_admin:ephemeral_ci_only@127.0.0.1:5432/postgres
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install PostgreSQL 18.6 clients
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo install -m 0644 .github/pgdg.sources /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18=18.6-3.pgdg24.04+1
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
          /usr/lib/postgresql/18/bin/psql --version
      - run: npm install --global pnpm@12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm verify:full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/
            playwright-report/
            test-results/
